<!--
  PHOTO IN THE OFFSET BEIGE FRAME — driven by site/assets/img/photos/manifest.json.
  For photo NAME: width/height = manifest[NAME].sizes["1440"] (w,h); the inline style's background is manifest[NAME].lqip
  (the tiny blurred data URI shows until the real file lands). alt text = spec §7.2, verbatim.
    · {{PREFIX}} → "./" on the home page, "../" on sub-pages.
    · loading="lazy" everywhere except the first visual in the viewport (then drop loading and add fetchpriority="high").
    · sizes: the photo's rendered width. Half-width split at 1120 max ≈ 540px → "(min-width: 900px) 540px, calc(100vw - 40px)".
      Full-width banner → "(min-width: 1184px) 1120px, calc(100vw - 40px)". Three-up portrait → "(min-width: 900px) 290px, 30vw".
    · Frame variants: .photo-frame--left (beige offset to the left instead of right) · --banner (21:9 crop) · --wide (3:2)
      · --portrait (4:5) · --square (1:1) · --sm (max 320px). Wrap in <figure> and add <figcaption> only when the spec gives a caption.
    · Decorative use (faded hero background): alt="" aria-hidden="true", no frame.
    · portrait-guy-smile and portrait-woman-redhair do not exist — never reference them.
-->
