<!--
  HEAD PARTIAL — paste everything from <head> to </head> into your page, then substitute by hand:
    {{TITLE}}        the page <title> from content-spec §3 (≤ 60 chars, exact text); a title that ends in the brand
                     ends "| Meetle: talk first, match later" (README brand rule 1)
    {{DESCRIPTION}}  the meta description from content-spec §3 (≤ 155 chars, exact text)
    {{CANONICAL}}    absolute, trailing slash: https://meetle.org/  ·  https://meetle.org/how-it-works/  …
    {{OG_ALT}}       what the card shows, in words (og-home.jpg: "meetle.org — Talk first, match later. No profile, no photo, no real name: just a conversation with one stranger, text first. Free, in your browser, 18+.")
    {{OG_IMAGE}}     file name only: og-home.jpg | og-how-it-works.jpg | og-safety.png
                     (faq, privacy and terms reuse og-home.jpg)
    {{PREFIX}}       relative path to the site root: "./" on the home page, "../" on every /sub-page/index.html
  Then replace the JSON-LD comment line with the page's <script type="application/ld+json"> (spec §8.1).
  Rules: the literal string "<head>" must stay on its own with no attributes (the deploy script injects after it);
  no <meta name="robots"> here (404.html is the only page that carries noindex, and it has no canonical/OG).
  Do not add anything that loads from another origin. The page follows prefers-color-scheme (night tokens in site.css),
  hence the two theme-colors and color-scheme "light dark". Preload Nunito + the display serif (every H1 uses it).
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="theme-color" content="#F5EFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1917" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:site_name" content="Meetle">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://meetle.org/assets/og/{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://meetle.org/assets/og/{{OG_IMAGE}}">
<link rel="icon" href="{{PREFIX}}favicon.ico" sizes="32x32">
<link rel="icon" href="{{PREFIX}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{PREFIX}}favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{PREFIX}}apple-touch-icon.png">
<link rel="manifest" href="{{PREFIX}}site.webmanifest">
<link rel="preload" href="{{PREFIX}}assets/fonts/nunito-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{PREFIX}}assets/fonts/instrument-serif-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{PREFIX}}assets/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{PREFIX}}assets/css/site.css">
<script src="{{PREFIX}}assets/js/site.js" defer></script>
<!-- JSON-LD: replace this comment with the page's <script type="application/ld+json">…</script> (spec §8.1) -->
</head>
