<!--
  WAITLIST FORM BLOCK — paste as-is. Rules:
    · {{PREFIX}} → "./" on the home page, "../" on sub-pages.
    · The FIRST block on a page keeps id="waitlist" (the nav CTA links to it). A SECOND block on the same page
      must use id="waitlist-2" and suffix EVERY id / for / aria-describedby below with "-2"
      (waitlist-2-email, waitlist-2-hp, waitlist-2-error, waitlist-2-help). Never duplicate an id.
    · data-endpoint stays "" — the README explains how to set it. site.js handles every state
      (idle / sending / success / error, honeypot) and replaces the <form> with the role="status" success box.
    · Add class="waitlist--center" to the outer div when the block sits under a centred headline.
-->
<div class="waitlist" id="waitlist">
  <form class="js-waitlist" method="post" data-endpoint="">
    <fieldset>
      <legend class="sr-only">Join the Meetle waitlist</legend>
      <label class="waitlist__label" for="waitlist-email">Email address</label>
      <div class="waitlist__row">
        <input class="waitlist__input" id="waitlist-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required aria-describedby="waitlist-help waitlist-error">
        <button class="btn btn--primary" type="submit">Join the waitlist</button>
      </div>
      <p class="sr-only"><label for="waitlist-hp">Leave this field empty</label> <input class="js-hp" id="waitlist-hp" name="website" type="text" tabindex="-1" autocomplete="off"></p>
      <p class="waitlist__error js-error" id="waitlist-error" role="alert" hidden></p>
      <p class="waitlist__helper" id="waitlist-help">We'll email you when Meetle opens, and not much else. <a href="{{PREFIX}}privacy/">Privacy</a></p>
    </fieldset>
  </form>
</div>
