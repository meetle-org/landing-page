  Marketing-only strings (flagged in spec §6): "Added", the "Friends" pill, the M1 helper line, the M2 hint,
  the M7 captions, the M10 callouts. riley_m's own throwaway id on the M7 "Their screen" phone (user_5c2e7b) is
